<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KrishiMitra AI - Secure Farmer Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;background:linear-gradient(135deg,#071b11,#0f3d1c,#1b5e20,#2e7d32);color:white;position:relative;}
body::before{content:"";position:absolute;width:500px;height:500px;background:rgba(0,255,100,0.15);border-radius:50%;top:-150px;left:-150px;filter:blur(120px);animation:move1 8s infinite alternate;}
body::after{content:"";position:absolute;width:450px;height:450px;background:rgba(255,255,0,0.12);border-radius:50%;bottom:-150px;right:-150px;filter:blur(120px);animation:move2 10s infinite alternate;}
@keyframes move1{0%{transform:translate(0,0);}100%{transform:translate(100px,50px);}}
@keyframes move2{0%{transform:translate(0,0);}100%{transform:translate(-100px,-50px);}}
.particles span{position:absolute;width:6px;height:6px;background:rgba(255,255,255,0.4);border-radius:50%;animation:float 12s linear infinite;}
@keyframes float{0%{transform:translateY(100vh) scale(0);opacity:0;}50%{opacity:1;}100%{transform:translateY(-10vh) scale(1);opacity:0;}}
.box{position:relative;z-index:10;width:380px;padding:40px 32px;border-radius:28px;background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.18);box-shadow:0 12px 40px rgba(0,0,0,0.45),0 0 25px rgba(0,255,100,0.15);text-align:center;animation:fade 1s ease;}
@keyframes fade{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
.logo{width:80px;height:80px;margin:0 auto 16px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:38px;background:linear-gradient(135deg,#00e676,#00c853);box-shadow:0 0 30px rgba(0,255,100,0.6);color:#041f11;}
h1{font-size:28px;margin-bottom:6px;}
.sub{font-size:13px;color:#d5ffe3;margin-bottom:24px;}
.inputBox{position:relative;margin:16px 0;}
.inputBox input{width:100%;padding:14px 45px;border:none;outline:none;border-radius:16px;background:rgba(255,255,255,0.12);color:white;font-size:15px;transition:0.3s;border:1px solid rgba(255,255,255,0.15);}
.inputBox input:focus{background:rgba(255,255,255,0.2);box-shadow:0 0 12px rgba(0,255,100,0.4);border-color:#00e676;}
.inputBox input::placeholder{color:#ccc;}
.inputBox i.icon-lead{position:absolute;top:16px;left:18px;color:#eee;}
.eye{position:absolute;top:16px;right:18px;color:#eee;cursor:pointer;}
.btn-login{width:100%;padding:14px;margin-top:16px;border:none;border-radius:16px;font-size:16px;font-weight:bold;cursor:pointer;color:#041f11;background:linear-gradient(135deg,#00e676,#00c853);transition:0.3s;box-shadow:0 0 20px rgba(0,255,100,0.4);display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(0,255,100,0.7);}
.btn-demo{width:100%;padding:12px;margin-top:10px;border:1px solid rgba(0,255,136,0.5);border-radius:16px;font-size:14px;font-weight:600;cursor:pointer;color:#b4ffda;background:rgba(0,255,136,0.1);transition:0.3s;}
.btn-demo:hover{background:rgba(0,255,136,0.25);}
.footer{margin-top:22px;font-size:12px;color:#b6dfc7;}
.error{margin-top:14px;font-size:13px;color:#ff9999;display:none;background:rgba(255,0,0,0.2);padding:8px;border-radius:10px;}
@media(max-width:420px){.box{width:92%;padding:30px 20px;}}
</style>
</head>
<body>
<div class="particles" id="particles"></div>

<div class="box">
  <div class="logo">🌾</div>
  <h1>KrishiMitra AI</h1>
  <div class="sub">Smart Agriculture & Farm Assistant</div>

  <div class="inputBox">
    <i class="fa fa-user icon-lead"></i>
    <input type="text" id="username" placeholder="Username (e.g. kctcoder)">
  </div>

  <div class="inputBox">
    <i class="fa fa-lock icon-lead"></i>
    <input type="password" id="password" placeholder="Password (e.g. admine)">
    <i class="fa fa-eye eye" onclick="togglePassword()"></i>
  </div>

  <button onclick="login()" class="btn-login" id="btn">
    <i class="fa-solid fa-right-to-bracket"></i> Login to Farm
  </button>

  <button onclick="quickDemoLogin()" class="btn-demo">
    🌾 1-Click Demo Farmer Login
  </button>

  <div class="error" id="errorMsg">
    ❌ Invalid credentials. (Hint: kctcoder / admine or use 1-Click Demo)
  </div>

  <div class="footer">AI • Smart Farming • Agritech Innovation</div>
</div>

<script>
// Particles generator
const particles = document.getElementById("particles");
for(let i=0; i<35; i++){
  const span = document.createElement("span");
  span.style.left = Math.random()*100 + "vw";
  span.style.animationDuration = (5 + Math.random()*8) + "s";
  span.style.animationDelay = Math.random()*5 + "s";
  particles.appendChild(span);
}

function togglePassword(){
  const pass = document.getElementById("password");
  pass.type = (pass.type === "password") ? "text" : "password";
}

function login(){
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const btn = document.getElementById("btn");
  const errorMsg = document.getElementById("errorMsg");

  if((username === "kctcoder" && password === "admine") || (username && password)) {
    errorMsg.style.display = "none";
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...`;
    localStorage.setItem("loggedIn", "true");
    localStorage.setItem("farmerName", username || "kct coder");

    setTimeout(()=>{
      window.location.href = "index.html";
    }, 1000);
  } else {
    errorMsg.style.display = "block";
  }
}

function quickDemoLogin(){
  document.getElementById("username").value = "kctcoder";
  document.getElementById("password").value = "admine";
  login();
}
</script>
</body>
</html>
