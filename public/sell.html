<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KrishiMitra Marketplace - Sell Your Crop Direct</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{min-height:100vh;background:linear-gradient(to bottom,#061a10,#0b291a,#0e3824);overflow-x:hidden;color:#e8f5e9;}
.navbar{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;background:rgba(255,255,255,0.06);backdrop-filter:blur(10px);border-bottom:1px solid rgba(0,255,136,0.15);}
.logo-title{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;color:#00ff88;text-decoration:none;}
.nav-links{display:flex;gap:10px;}
.nav-btn{padding:8px 16px;border-radius:14px;background:rgba(255,255,255,0.08);color:white;text-decoration:none;font-weight:600;font-size:13px;border:1px solid rgba(255,255,255,0.12);transition:0.2s;}
.nav-btn:hover{background:rgba(0,255,136,0.2);color:#00ff88;}
header{padding:30px 20px 15px;text-align:center;}
header h1{font-size:38px;font-weight:800;color:#00ff88;}
header p{margin-top:6px;font-size:15px;color:#a7f3d0;}
.formBox{width:92%;max-width:700px;margin:20px auto;background:rgba(255,255,255,0.06);border:1px solid rgba(0,255,136,0.2);backdrop-filter:blur(12px);padding:30px;border-radius:26px;}
.formTitle{font-size:20px;margin-bottom:16px;color:#00ff88;display:flex;align-items:center;gap:10px;}
.inputGroup{margin-bottom:14px;text-align:left;}
label{display:block;margin-bottom:5px;font-weight:600;color:#a7f3d0;font-size:13px;}
input,select{width:100%;padding:12px 14px;border:none;outline:none;border-radius:12px;font-size:14px;background:rgba(0,0,0,0.4);border:1px solid rgba(0,255,136,0.3);color:white;transition:0.3s;}
input:focus,select:focus{border-color:#00ff88;box-shadow:0 0 10px rgba(0,255,136,0.3);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.addBtn{width:100%;padding:14px;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#00ff88,#00b562);color:#042214;transition:0.3s;margin-top:8px;}
.addBtn:hover{box-shadow:0 0 20px rgba(0,255,136,0.4);}
.marketTitle{text-align:center;font-size:26px;margin-top:40px;color:#00ff88;}
.listings{width:92%;max-width:1100px;margin:20px auto 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;}
.listing{background:rgba(255,255,255,0.05);border:1px solid rgba(0,255,136,0.15);backdrop-filter:blur(10px);padding:18px;border-radius:20px;display:flex;flex-direction:column;justify-content:space-between;}
.listing:hover{border-color:#00ff88;}
.listing h2{font-size:18px;margin-bottom:8px;color:white;display:flex;align-items:center;justify-content:space-between;}
.listing p{margin:4px 0;font-size:13px;color:#c8e6c9;}
.total{margin-top:12px;padding:10px 14px;border-radius:12px;background:rgba(0,0,0,0.3);color:#00ff88;font-weight:700;font-size:15px;display:flex;justify-content:space-between;font-family:monospace;}
.card-actions{display:flex;gap:8px;margin-top:12px;}
.contactBtn{flex:1;padding:9px;border-radius:10px;border:none;background:#00ff88;color:#042214;font-weight:700;font-size:12px;cursor:pointer;}
.deleteBtn{padding:9px 12px;border:none;border-radius:10px;background:rgba(255,82,82,0.2);color:#ff5252;cursor:pointer;}
@media(max-width:768px){.form-row{grid-template-columns:1fr;}.formBox{padding:20px;}}
</style>
</head>
<body>
<div class="navbar">
  <a href="index.html" class="logo-title">
    <span>🌾</span> KrishiMitra Direct Marketplace
  </a>
  <div class="nav-links">
    <a href="market.html" class="nav-btn"><i class="fa-solid fa-chart-line"></i> Mandi Rates</a>
    <a href="index.html" class="nav-btn"><i class="fa-solid fa-house"></i> Dashboard</a>
  </div>
</div>

<header>
  <h1>🛒 Sell Your Harvest Direct to Mandis</h1>
  <p>Persistent farmer lot registry connecting directly with bulk buyers without commission.</p>
</header>

<div class="formBox">
  <h2 class="formTitle"><i class="fa-solid fa-circle-plus"></i> List New Harvest Lot</h2>

  <div class="inputGroup">
    <label>👤 Farmer / Producer Name</label>
    <input type="text" id="name" placeholder="e.g. Ramesh Patil">
  </div>

  <div class="form-row">
    <div class="inputGroup">
      <label>🌾 Crop / Commodity</label>
      <input type="text" id="crop" placeholder="e.g. Sona Masuri Rice (Clean)">
    </div>
    <div class="inputGroup">
      <label>📍 Farm Location / District</label>
      <input type="text" id="city" placeholder="e.g. Davangere, Karnataka">
    </div>
  </div>

  <div class="form-row">
    <div class="inputGroup">
      <label>⚖️ Available Quantity (kg)</label>
      <input type="number" id="quantity" placeholder="e.g. 1500" min="10">
    </div>
    <div class="inputGroup">
      <label>💰 Expected Price per kg (₹)</label>
      <input type="number" id="price" placeholder="e.g. 45" min="1">
    </div>
  </div>

  <button class="addBtn" onclick="addListing()">
    <i class="fa-solid fa-bullhorn"></i> Publish Harvest Lot
  </button>
</div>

<h2 class="marketTitle"><i class="fa-solid fa-boxes-stacked"></i> Active Verified Produce Lots</h2>
<div id="listings" class="listings"></div>

<script>
async function loadListings() {
  try {
    const res = await fetch('/api/marketplace/produce');
    const data = await res.json();
    renderListings(data);
  } catch(e) {
    console.error('Produce fetch error:', e);
  }
}

function renderListings(list) {
  const container = document.getElementById("listings");
  if (!list || list.length === 0) {
    container.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#a7f3d0;">No active harvest lots. Add your crop above!</div>`;
    return;
  }

  let html = "";
  list.forEach(item => {
    const total = item.quantity * item.pricePerKg;
    html += `
      <div class="listing">
        <div>
          <h2>
            <span>🌾 ${item.crop}</span>
            <span style="font-size:10px;color:#00ff88;background:rgba(0,255,136,0.15);padding:3px 8px;border-radius:10px;">${item.status}</span>
          </h2>
          <p><i class="fa-solid fa-user"></i> <b>Farmer:</b> ${item.farmerName}</p>
          <p><i class="fa-solid fa-location-dot"></i> <b>Location:</b> ${item.location}</p>
          <p><i class="fa-solid fa-weight-scale"></i> <b>Quantity:</b> ${item.quantity.toLocaleString()} kg</p>
          <p><i class="fa-solid fa-tag"></i> <b>Rate:</b> ₹${item.pricePerKg} / kg</p>
        </div>
        <div>
          <div class="total">
            <span>Lot Value:</span>
            <span>₹${total.toLocaleString()}</span>
          </div>
          <div class="card-actions">
            <button class="contactBtn" onclick="contactBuyer('${item.farmerName}', '${item.crop}', '${item.phone}')">
              <i class="fa-solid fa-phone"></i> Inquire / Buy
            </button>
            <button class="deleteBtn" onclick="deleteListing('${item.id}')" title="Delete Listing">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

async function addListing() {
  const farmerName = document.getElementById("name").value.trim();
  const crop = document.getElementById("crop").value.trim();
  const quantity = parseFloat(document.getElementById("quantity").value);
  const pricePerKg = parseFloat(document.getElementById("price").value);
  const location = document.getElementById("city").value.trim() || "Davangere, Karnataka";

  if (!farmerName || !crop || !quantity || !pricePerKg) {
    alert("Please fill in all required fields!");
    return;
  }

  try {
    const res = await fetch('/api/marketplace/produce', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        farmerName,
        crop,
        quantity,
        pricePerKg,
        location,
        category: 'Cereals'
      })
    });
    const data = await res.json();
    if (data.success) {
      alert("🎉 Your harvest lot has been saved to the persistent backend!");
      document.getElementById("name").value = "";
      document.getElementById("crop").value = "";
      document.getElementById("quantity").value = "";
      document.getElementById("price").value = "";
      document.getElementById("city").value = "";
      loadListings();
    }
  } catch(e) {
    console.error(e);
  }
}

async function deleteListing(id) {
  if (!confirm("Remove this produce listing?")) return;
  try {
    await fetch(`/api/marketplace/produce/${id}`, { method: 'DELETE' });
    loadListings();
  } catch(e) {
    console.error(e);
  }
}

function contactBuyer(name, crop, phone) {
  alert(`📞 Direct Farmer Contact:\n\nFarmer: ${name}\nProduce: ${crop}\nPhone: ${phone || 'Available via Desk'}\n\nOur trade desk has registered your interest.`);
}

loadListings();
</script>
</body>
</html>
